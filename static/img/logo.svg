<svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Tech Frame -->
  <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" 
           stroke="url(#cyberGrad)" 
           stroke-width="2.5" 
           fill="#0f172a" 
           fill-opacity="0.9" />

  <!-- Inner Pulse Radar Rings -->
  <circle cx="24" cy="24" r="14" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="24" cy="24" r="8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Dynamic Network Rocket / Speed Beam -->
  <path d="M24 10 L29 23 L24 20 L19 23 Z" fill="url(#cyberGrad)" filter="url(#glow)"/>
  <path d="M24 20 L24 38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Satellite Communication Nodes -->
  <circle cx="13" cy="18" r="2" fill="#34d399"/>
  <circle cx="35" cy="18" r="2" fill="#34d399"/>
  <circle cx="24" cy="38" r="2.5" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Center Core Node -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
